<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>NexVault Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#010208;color:#f0f9ff;font-family:Rajdhani,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(239,68,68,0.08) 0%,transparent 60%),radial-gradient(ellipse at 100% 100%,rgba(245,158,11,0.05) 0%,transparent 50%);pointer-events:none}
.grid{position:fixed;inset:0;background-image:linear-gradient(rgba(239,68,68,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(239,68,68,0.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.wrap{width:100%;max-width:440px;padding:24px;position:relative;z-index:10}
.logo{text-align:center;margin-bottom:40px}
.logo-text{font-family:Orbitron,monospace;font-size:2.2rem;font-weight:900;letter-spacing:4px}
.logo-nex{color:#ef4444}
.logo-vault{color:#fbbf24}
.logo-sub{font-family:'Share Tech Mono',monospace;font-size:0.65rem;letter-spacing:6px;color:#334155;margin-top:8px;text-transform:uppercase}
.card{background:rgba(3,7,18,0.98);border:1px solid rgba(239,68,68,0.2);border-radius:10px;padding:40px;box-shadow:0 0 80px rgba(239,68,68,0.06),0 0 40px rgba(0,0,0,0.5)}
.topbar{height:2px;background:linear-gradient(90deg,#ef4444,#f59e0b,#ef4444);border-radius:2px;margin-bottom:32px}
.card-header{display:flex;align-items:center;gap:12px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid rgba(239,68,68,0.1)}
.lock-icon{width:40px;height:40px;border-radius:50%;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.card-title{font-family:Orbitron,monospace;font-size:0.9rem;font-weight:700;color:#f1f5f9}
.card-sub{font-size:0.72rem;color:#475569;font-family:'Share Tech Mono',monospace;margin-top:3px}
.secure-badge{margin-left:auto;padding:3px 10px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:20px;font-family:'Share Tech Mono',monospace;font-size:0.58rem;color:#ef4444;white-space:nowrap}
.error-box{display:none;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-left:3px solid #ef4444;border-radius:0 6px 6px 0;padding:12px 16px;margin-bottom:20px;font-size:0.82rem;color:#ef4444;font-family:'Share Tech Mono',monospace}
.field{margin-bottom:20px}
.field label{font-family:'Share Tech Mono',monospace;font-size:0.62rem;letter-spacing:3px;color:#475569;display:block;margin-bottom:8px;text-transform:uppercase}
.field input{width:100%;padding:13px 16px;background:rgba(239,68,68,0.04);border:1px solid rgba(239,68,68,0.18);border-radius:6px;color:#f0f9ff;font-size:1rem;outline:none;font-family:Rajdhani,sans-serif;transition:border-color 0.2s,box-shadow 0.2s}
.field input:focus{border-color:rgba(239,68,68,0.5);box-shadow:0 0 0 3px rgba(239,68,68,0.06)}
.field input::placeholder{color:#334155}
.btn{width:100%;padding:15px;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-family:Orbitron,monospace;font-size:0.75rem;font-weight:700;letter-spacing:3px;border:none;border-radius:6px;cursor:pointer;transition:all 0.2s;margin-top:4px}
.btn:hover{box-shadow:0 0 30px rgba(239,68,68,0.4);transform:translateY(-1px)}
.btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.footer-note{text-align:center;margin-top:20px;font-family:'Share Tech Mono',monospace;font-size:0.6rem;color:#1e3a5f;letter-spacing:2px}
.spinner{display:none;text-align:center;margin-top:16px}
.dot-pulse{display:inline-flex;gap:4px}
.dot-pulse span{width:6px;height:6px;border-radius:50%;background:#ef4444;animation:pulse 1.2s infinite ease-in-out}
.dot-pulse span:nth-child(2){animation-delay:0.2s}
.dot-pulse span:nth-child(3){animation-delay:0.4s}
@keyframes pulse{0%,80%,100%{transform:scale(0.6);opacity:0.4}40%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="grid"></div>
<div class="wrap">
  <div class="logo">
    <div class="logo-text"><span class="logo-nex">NEX</span><span class="logo-vault">VAULT</span></div>
    <div class="logo-sub">Admin Control Panel</div>
  </div>
  <div class="card">
    <div class="topbar"></div>
    <div class="card-header">
      <div class="lock-icon">&#128274;</div>
      <div>
        <div class="card-title">RESTRICTED ACCESS</div>
        <div class="card-sub">Authorized administrators only</div>
      </div>
      <div class="secure-badge">&#9679; SSL SECURED</div>
    </div>
    <div class="error-box" id="err"></div>
    <div class="field">
      <label>Admin Email</label>
      <input type="email" id="email" placeholder="admin@nexvault.io" autocomplete="username"/>
    </div>
    <div class="field">
      <label>Admin Password</label>
      <input type="password" id="password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" autocomplete="current-password"/>
    </div>
    <button class="btn" id="btn" onclick="doLogin()">ACCESS VAULT &rarr;</button>
    <div class="spinner" id="spinner">
      <div class="dot-pulse"><span></span><span></span><span></span></div>
    </div>
    <div class="footer-note">NEXVAULT ADMIN &middot; UNAUTHORIZED ACCESS IS PROHIBITED</div>
  </div>
</div>
<script>
const API = '/api';

document.addEventListener('keydown', function(e){
  if(e.key === 'Enter') doLogin();
});

async function doLogin(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  const spinner = document.getElementById('spinner');

  err.style.display = 'none';

  if(!email || !password){
    showError('Please enter your email and password.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'AUTHENTICATING...';
  spinner.style.display = 'block';

  try {
    const res = await fetch(API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if(!res.ok){
      showError(data.message || 'Login failed. Check your credentials.');
      reset();
      return;
    }

    if(!data.token){
      showError('No token received. Contact system administrator.');
      reset();
      return;
    }

    // Verify the token is admin role
    const vRes = await fetch(API + '/auth/verify', {
      headers: { Authorization: 'Bearer ' + data.token }
    });
    const vData = await vRes.json();

    if(!vData.valid){
      showError('Token verification failed. Try again.');
      reset();
      return;
    }

    if(vData.user.role !== 'admin'){
      showError('Access denied. This account does not have admin privileges.');
      reset();
      return;
    }

    // Success — store token and go to admin panel
    localStorage.setItem('nexvault_token', data.token);
    window.location.href = '/admin';

  } catch(e) {
    showError('Connection error. Please try again.');
    reset();
  }
}

function showError(msg){
  const err = document.getElementById('err');
  err.textContent = '&#9888; ' + msg;
  err.style.display = 'block';
}

function reset(){
  const btn = document.getElementById('btn');
  btn.disabled = false;
  btn.textContent = 'ACCESS VAULT →';
  document.getElementById('spinner').style.display = 'none';
}
</script>
</body>
</html>
